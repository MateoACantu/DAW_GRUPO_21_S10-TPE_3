  ============================================================================
  index.html — Página principal · «Miembros del equipo # 21»
  Fase 1 · Responsable: [Integrante 1]
  ============================================================================

  OBJETIVO
  Construir la página principal del sitio de la serie (Game of Thrones) con la
  presentación de los seis integrantes del Grupo 21. Este archivo contiene solo
  la estructura HTML; el diseño vive en css/styles.css y el comportamiento
  común en js/main.js.

  CONTENIDO QUE DEBE IR EN ESTE ARCHIVO
  1. Cabecera del documento
     - <!DOCTYPE html>, lang="es", charset UTF-8 y viewport.
     - <title> con el nombre de la serie y el grupo.
     - Bootstrap 5 por CDN con versión fija (solo rejilla y navbar).
     - Google Fonts: Cinzel para títulos y Lora o Crimson Text para el cuerpo.
     - Enlace a css/styles.css mediante ruta relativa.

  2. Encabezado y navegación (#navbar)
     - Logo en img/logo/logo.png (provisional: reemplazar por el emblema
       propio del grupo) y nombre «Game of Thrones» en Cinzel dorado.
     - Enlaces «Principal» y «Personajes»; .active en Principal.
     - En móvil se colapsa con el navbar de Bootstrap.

  3. Título de sección
     - «Miembros del equipo # 21» centrado, con filete dorado y una línea
       secundaria con el nombre de la materia.

  4. Rejilla de integrantes (#integrantes, fila de Bootstrap)
     - Seis tarjetas .card-integrante: 3 columnas en escritorio, 2 en tableta
       y 1 en móvil.
     - Cada tarjeta debe incluir: foto, nombre, carrera, nivel, correo
       (enlace mailto:) y paralelo.
     - Orden fijo de los datos: carrera, nivel, correo, paralelo.
     - alt descriptivo en cada foto y overflow-wrap: anywhere para correos
       largos.
     - Fotos en img/integrantes/integrante-01.jpg ... integrante-06.jpg.

  5. Pie de página
     - «Grupo 21 · Desarrollo de Aplicaciones Web · UNEMI».
     - Crédito de la API enlazado a https://thronesapi.com/ en pestaña nueva.

  6. Carga de scripts
     - <script src="js/main.js" defer></script> al final del body.

  CONTRATO TÉCNICO QUE DEBE RESPETAR (§7.1 DE LA GUÍA)
  - #navbar y .nav-link (con .active en la página actual).
  - #integrantes.
  - .card-integrante, .card-integrante__foto, .card-integrante__nombre y
    .card-integrante__dato.
  - No cambiar estos nombres sin avisar al equipo.

  REGLAS DE LA GUÍA
  - Solo HTML semántico; sin estilos en línea ni scripts embebidos.
  - Todas las rutas son relativas: el sitio debe abrir con doble clic.
  - No se usa base de datos: los datos de los integrantes se escriben aquí.
  - Los datos personales se toman del Anexo A de la guía.
  - Un solo dueño por archivo; los cambios se pactan con la fase 5.

  REFERENCIAS
  - Guía de Planificación: §1 (propósito y alcance), §4 (identidad visual),

    §8 Fase 1, §9 (flujo de trabajo en GitHub), §10 (riesgos) y §11
    (lista de verificación).
