<!--

  ARCHIVO: index.html

  ENTREGA: estructura HTML completa y validada de la página principal

  OBJETIVO
  Construir la página principal del sitio. Este archivo define también el
  encabezado y el pie de página que Rol 2 reutilizará en personajes.html.

  SECCIONES OBLIGATORIAS (en este orden)
  1) header.site-header
     - .container.header-inner
     - a.brand[href="index.html"] con span.brand-mark (W) y span.brand-text
       (Westeros + span.brand-sub "Explorador de personajes")
     - nav.site-nav con "Inicio" (clase active) y "Personajes"
  2) main > section.hero
     - .container.hero-content con p.eyebrow, h1 (con un span resaltado),
       p.hero-lead, .hero-actions (2 botones) y .hero-stats con 3 .stat:
       53 Personajes, 25 Casas y facciones, 100% Datos en vivo
  3) section.section#proyecto
     - .container con p.eyebrow, h2, p.section-lead y .cards
     - 3 article.card, cada uno con span.card-index (01, 02, 03), h3 y p
     - Temas: consumo de API, búsqueda y filtro, ficha detallada
  4) section.section.section-alt (Tecnologías)
     - p.eyebrow, h2, .tech-list con HTML5, CSS3, JavaScript, Fetch API,
       thronesapi.com y un p.section-lead que aclare que no hay base de datos
       ni frameworks de interfaz
  5) section.cta-band
     - .container.cta-inner con h2, p y un enlace .btn.btn-primary a
       personajes.html
  6) footer.site-footer
     - .container.footer-inner, .footer-brand con .brand-mark.small,
       p.footer-note con enlace a https://thronesapi.com/ y p.footer-copy
       con "© 2026 GRUPO 21 · Desarrollo de Aplicaciones Web"

  CLASES COMPARTIDAS QUE DEBEN RESPETARSE
  site-header, container, header-inner, brand, brand-mark, brand-text,
  brand-sub, site-nav, hero, hero-content, eyebrow, hero-lead, hero-actions,
  btn, btn-primary, btn-ghost, hero-stats, stat, section, section-alt,
  section-lead, cards, card, card-index, tech-list, tech, cta-band,
  cta-inner, site-footer, footer-inner, footer-brand, footer-note,
  footer-copy.

  REGLAS
  - No escribir estilos ni JavaScript dentro de este archivo.
  - No modificar css/styles.css ni js/personajes.js.
  - Usar HTML5 semántico, textos en español y enlaces relativos.
  - El encabezado y el pie deben quedar listos para que Rol 2 los copie
    sin cambios, salvo el enlace marcado como active.
  - El contenido de la API no se consulta en esta página: los datos
    numéricos (53 y 25) son informativos y deben coincidir con la guía.

  CRITERIOS DE ACEPTACIÓN
  [ ] El documento valida sin errores en el navegador.
  [ ] Los enlaces Inicio/Personajes funcionan y el active corresponde.
  [ ] Existen todas las secciones y se respeta la jerarquía h1 > h2 > h3.
  [ ] No hay IDs duplicados ni enlaces vacíos.
  [ ] La página se ve correctamente sin JavaScript.
  [ ] Al terminar, avisar a Rol 2 (personajes.html) y a Rol 4 (styles.css)
      para que integren el encabezado, el pie y los estilos.

  NOTA: en este archivo base solo existen las indicaciones. La estructura
  HTML debe ser creada por el responsable del rol.
