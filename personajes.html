<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listado y detalle de personajes de Game of Thrones obtenido en vivo desde thronesapi.com.">
  <title>Westeros | Personajes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--
  ============================================================================
  ARCHIVO: personajes.html
  RESPONSABLE: Rol 2 - Juan Carlos Izurieta Cisneros
  RAMA: feat/personajes
  DEPENDE DE: encabezado y pie entregados por Rol 1 (index.html)
  ENTREGA: estructura HTML de la página de personajes y el contrato de IDs
  ============================================================================

  OBJETIVO
  Construir la página que consume la API. Este archivo solo contiene el
  marcado: la lógica pertenece a Rol 3 (js/personajes.js) y los estilos a
  Rol 4 (css/styles.css).

  ESTRUCTURA OBLIGATORIA
  1) header.site-header y footer.site-footer
     - Reutilizar exactamente el marcado de index.html.
     - En site-nav, marcar "Personajes" con class="active".
  2) main > section.page-hero
     - .container con p.eyebrow "Galería · API thronesapi.com", h1
       "Personajes" y p.section-lead.
  3) section.section > .container
     a) .toolbar
        - .field.field-search con label[for="search"] e input#search
          (type="search", placeholder "Nombre, título o casa...",
          autocomplete="off")
        - .field con label[for="family"] y select#family con la opción
          inicial <option value="">Todas</option>
        - p#resultCount.result-count[aria-live="polite"] con "Cargando..."
     b) Estados (deben existir en el HTML; los muestra/oculta el JS)
        - #loading.status[role="status"] con span.spinner y un p
        - #error.status.status-error[hidden] con p#errorMessage y
          button#retry.btn.btn-primary[type="button"] (Reintentar)
        - #empty.status[hidden] con el mensaje de "sin resultados"
     c) #grid.character-grid (contenedor vacío; el JS inserta las tarjetas)
  4) Ventana modal (fuera de main, antes del footer)
     - #modal.modal[hidden]
     - .modal-backdrop con atributo data-close
     - .modal-card[role="dialog"][aria-modal="true"]
       [aria-labelledby="modalName"]
     - button#modalClose.modal-close[aria-label="Cerrar"]
     - .modal-media con img#modalImage (src y alt vacíos al inicio)
     - .modal-body con:
       p#modalId.eyebrow, h2#modalName, p#modalTitle.modal-title,
       dl.modal-data con dd#modalFirstName, dd#modalLastName,
       dd#modalFamily y dd#modalIdentifier
  5) Al final del body: <script src="js/personajes.js" defer></script>

  IDS OBLIGATORIOS (no cambiar nombres ni mayúsculas)
  search, family, resultCount, loading, error, errorMessage, retry, empty,
  grid, modal, modalClose, modalImage, modalId, modalName, modalTitle,
  modalFirstName, modalLastName, modalFamily, modalIdentifier

  CLASES OBLIGATORIAS
  page-hero, toolbar, field, field-search, result-count, status,
  status-error, spinner, character-grid, modal, modal-backdrop, modal-card,
  modal-close, modal-media, modal-body, modal-title, modal-data.

  ACCESIBILIDAD
  - Todos los campos deben tener label asociado con for/id.
  - El modal debe llevar role="dialog", aria-modal y aria-labelledby.
  - Los estados deben poder anunciarse (role="status" / aria-live).
  - El backdrop se cierra con data-close; el botón con aria-label.

  REGLAS
  - No escribir CSS ni JavaScript dentro de este archivo.
  - No cambiar los IDs sin avisar a Rol 3 y Rol 4: son el contrato.
  - No incluir tarjetas de personajes: se generan desde JavaScript.
  - Mantener los textos de la interfaz en español.

  CRITERIOS DE ACEPTACIÓN
  [ ] El documento valida sin errores.
  [ ] Todos los IDs de la lista existen una sola vez.
  [ ] Los estados inician ocultos (hidden) salvo #loading.
  [ ] El modal inicia oculto y contiene todos los campos de la ficha.
  [ ] El encabezado y el pie coinciden con index.html.
  [ ] La página no muestra errores de consola antes de cargar el JS.
  [ ] Al terminar, avisar a Rol 3 (JS) y Rol 4 (CSS).

  NOTA: en este archivo base solo existen las indicaciones. El marcado debe
  ser creado por el responsable del rol.
-->
</body>
</html>
